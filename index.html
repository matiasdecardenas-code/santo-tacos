<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SANTO TACO | Taquería</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, sans-serif;
  background: #151515;
  color: white;
}

header {
  background: #101010;
  padding: 22px 15px;
  text-align: center;
  border-bottom: 2px solid #ff762b;
}

header h1 {
  color: #ff762b;
  font-size: 34px;
  letter-spacing: 2px;
}

header p {
  color: #bbb;
  margin-top: 7px;
}

.hero {
  text-align: center;
  padding: 85px 20px;
  background: linear-gradient(135deg, #392316, #111);
}

.hero h2 {
  font-size: 43px;
  margin-bottom: 15px;
}

.hero span {
  color: #ff762b;
}

.hero p {
  color: #ddd;
  font-size: 17px;
}

button {
  background: #ff762b;
  color: white;
  border: none;
  border-radius: 7px;
  padding: 11px 17px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #e65e15;
}

.hero button {
  margin-top: 25px;
  padding: 14px 25px;
}

.container {
  max-width: 1150px;
  margin: auto;
  padding: 45px 20px;
}

.section-title {
  text-align: center;
  color: #ff762b;
  font-size: 30px;
  margin-bottom: 28px;
}

.categories {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 32px;
}

.categories button {
  background: #292929;
  border: 1px solid #444;
}

.categories button.active {
  background: #ff762b;
  border-color: #ff762b;
}

.menu {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 22px;
}

.product {
  background: #242424;
  border: 1px solid #383838;
  border-radius: 13px;
  overflow: hidden;
  text-align: center;
  padding-bottom: 20px;
  transition: transform 0.2s;
}

.product:hover {
  transform: translateY(-5px);
}

.product-image {
  width: 100%;
  height: 190px;
  object-fit: cover;
  display: block;
  background: #383838;
}

.photo-fallback {
  display: none;
  height: 190px;
  background: #30241d;
  color: #ff762b;
  align-items: center;
  justify-content: center;
  font-size: 40px;
}

.product h3 {
  margin: 17px 10px 8px;
  font-size: 20px;
}

.product p {
  color: #aaa;
  font-size: 14px;
  padding: 0 12px;
  min-height: 34px;
}

.price {
  color: #ff762b;
  font-size: 22px;
  font-weight: bold;
  margin: 15px 0;
}

.product button {
  width: 85%;
}

.cart {
  background: #242424;
  padding: 27px;
  border-radius: 14px;
  margin-top: 55px;
}

.cart h2 {
  color: #ff762b;
  margin-bottom: 20px;
  font-size: 27px;
}

.empty {
  color: #bbb;
  padding: 12px 0;
}

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  border-bottom: 1px solid #444;
  padding: 16px 0;
}

.item-info {
  line-height: 1.7;
}

.item-controls {
  display: flex;
  align-items: center;
  gap: 9px;
}

.item-controls button {
  padding: 6px 12px;
}

.total {
  color: #ff762b;
  font-size: 25px;
  font-weight: bold;
  text-align: right;
  margin-top: 25px;
}

.cart-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 25px;
}

.cart-actions button {
  padding: 15px 10px;
}

.clear-button {
  background: #444;
}

.clear-button:hover {
  background: #555;
}

footer {
  text-align: center;
  background: #101010;
  color: #aaa;
  padding: 28px;
  margin-top: 50px;
}

@media(max-width: 600px) {
  .hero h2 {
    font-size: 30px;
  }

  .item {
    align-items: flex-start;
    flex-direction: column;
  }

  .cart-actions {
    grid-template-columns: 1fr;
  }

  .total {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<header>
  <h1>SANTO TACO 🌮</h1>
  <p>El verdadero sabor mexicano</p>
</header>

<section class="hero">
  <h2>¡Bienvenido a <span>SANTO TACO!</span></h2>
  <p>Buenos tacos, buenos momentos.</p>
  <button onclick="document.getElementById('menu-section').scrollIntoView()">
    VER MENÚ
  </button>
</section>

<main class="container" id="menu-section">

  <h2 class="section-title">NUESTRO MENÚ</h2>

  <div class="categories">
    <button class="active" onclick="filtrar('Todos', this)">Todos</button>
    <button onclick="filtrar('Tacos', this)">Tacos</button>
    <button onclick="filtrar('Especialidades', this)">Especialidades</button>
    <button onclick="filtrar('Bebidas', this)">Bebidas</button>
  </div>

  <div class="menu" id="menu"></div>

  <section class="cart">
    <h2>🛒 Tu pedido</h2>

    <div id="lista" class="empty">
      Todavía no agregas productos.
    </div>

    <div class="total" id="total">
      Total: $0 MXN
    </div>

    <div class="cart-actions">
      <button class="clear-button" onclick="vaciarCarrito()">
        Vaciar carrito
      </button>

      <button onclick="enviar()">
        Pedir por WhatsApp
      </button>
    </div>
  </section>

</main>

<footer>
  <p>© 2026 SANTO TACO | Página de demostración</p>
  <p style="margin-top:8px">Hecho para disfrutar buenos tacos.</p>
</footer>

<script>

const productos = [
  {
    nombre: "Tacos al pastor",
    descripcion: "Con piña, cebolla y cilantro.",
    precio: 18,
    categoria: "Tacos",
    imagen: "https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?w=600"
  },
  {
    nombre: "Tacos de bistec",
    descripcion: "Carne de res recién preparada.",
    precio: 22,
    categoria: "Tacos",
    imagen: "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=600"
  },
  {
    nombre: "Tacos de pollo",
    descripcion: "Pollo con verduras frescas.",
    precio: 20,
    categoria: "Tacos",
    imagen: "https://images.unsplash.com/photo-1512428559087-560fa5ceab42?w=600"
  },
  {
    nombre: "Quesadillas",
    descripcion: "Tortilla con queso derretido.",
    precio: 35,
    categoria: "Especialidades",
    imagen: "https://images.unsplash.com/photo-1618040996337-56904b7850b9?w=600"
  },
  {
    nombre: "Gringa",
    descripcion: "Tortilla de harina, queso y pastor.",
    precio: 55,
    categoria: "Especialidades",
    imagen: "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=600"
  },
  {
    nombre: "Torta de pastor",
    descripcion: "Con aguacate y verduras.",
    precio: 65,
    categoria: "Especialidades",
    imagen: "https://images.unsplash.com/photo-1553909489-cd47e0ef937f?w=600"
  },
  {
    nombre: "Refresco",
    descripcion: "Bebida fría de 600 ml.",
    precio: 25,
    categoria: "Bebidas",
    imagen: "https://images.unsplash.com/photo-1544145945-f90425340c7e?w=600"
  },
  {
    nombre: "Agua fresca",
    descripcion: "Bebida fresca del día.",
    precio: 22,
    categoria: "Bebidas",
    imagen: "https://images.unsplash.com/photo-1513558161293-cdaf765edfd4?w=600"
  }
];

let pedido = [];
let categoriaActual = "Todos";

function mostrar() {
  const menu = document.getElementById("menu");

  const filtrados = categoriaActual === "Todos"
    ? productos
    : productos.filter(p => p.categoria === categoriaActual);

  menu.innerHTML = filtrados.map(p => {
    const i = productos.indexOf(p);

    return `
      <div class="product">
        <img
          class="product-image"
          src="${p.imagen}"
          alt="${p.nombre}"
          loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
        >

        <div class="photo-fallback">🌮</div>

        <h3>${p.nombre}</h3>
        <p>${p.descripcion}</p>
        <div class="price">$${p.precio} MXN</div>

        <button onclick="agregar(${i})">
          Agregar al pedido
        </button>
      </div>
    `;
  }).join("");
}

function filtrar(categoria, boton) {
  categoriaActual = categoria;

  document.querySelectorAll(".categories button").forEach(b => {
    b.classList.remove("active");
  });

  boton.classList.add("active");
  mostrar();
}

function agregar(i) {
  const producto = pedido.find(p => p.nombre === productos[i].nombre);

  if (producto) {
    producto.cantidad++;
  } else {
    pedido.push({
      ...productos[i],
      cantidad: 1
    });
  }

  actualizar();
}

function cambiarCantidad(i, cambio) {
  pedido[i].cantidad += cambio;

  if (pedido[i].cantidad <= 0) {
    pedido.splice(i, 1);
  }

  actualizar();
}

function vaciarCarrito() {
  if (pedido.length === 0) {
    alert("Tu carrito ya está vacío.");
    return;
  }

  pedido = [];
  actualizar();
}

function actualizar() {
  const lista = document.getElementById("lista");

  if (pedido.length === 0) {
    lista.textContent = "Todavía no agregas productos.";
    lista.className = "empty";
  } else {
    lista.className = "";

    lista.innerHTML = pedido.map((p, i) => `
      <div class="item">
        <div class="item-info">
          <strong>${p.nombre}</strong><br>
          $${p.precio} x ${p.cantidad}
        </div>

        <div class="item-controls">
          <button onclick="cambiarCantidad(${i},-1)">−</button>
          <strong>${p.cantidad}</strong>
          <button onclick="cambiarCantidad(${i},1)">+</button>
        </div>
      </div>
    `).join("");
  }

  const total = pedido.reduce(
    (s, p) => s + p.precio * p.cantidad,
    0
  );

  document.getElementById("total").textContent =
    "Total: $" + total + " MXN";
}

function enviar() {
  if (pedido.length === 0) {
    alert("Primero agrega algo a tu pedido.");
    return;
  }

  let mensaje = "¡Hola! Quiero hacer este pedido:\n\n";

  pedido.forEach(p => {
    mensaje += p.nombre + " x" + p.cantidad +
      " - $" + (p.precio * p.cantidad) + "\n";
  });

  const total = pedido.reduce(
    (s, p) => s + p.precio * p.cantidad,
    0
  );

  mensaje += "\nTotal: $" + total + " MXN";

  const telefono = "524426785804";
  const url = "https://wa.me/" + telefono +
    "?text=" + encodeURIComponent(mensaje);

  window.open(url, "_blank");
}

mostrar();
actualizar();

</script>

</body>
</html>
