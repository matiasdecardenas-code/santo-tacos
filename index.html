<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SANTO TACO | Taquería</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #151515;
  color: white;
}

header {
  background: #101010;
  padding: 22px;
  text-align: center;
  border-bottom: 2px solid #ff762b;
}

header h1 {
  color: #ff762b;
  font-size: 34px;
}

header p {
  color: #ccc;
  margin-top: 6px;
}

.hero {
  text-align: center;
  padding: 65px 20px;
  background: linear-gradient(135deg, #292018, #111);
}

.hero h2 {
  font-size: 38px;
  margin-bottom: 12px;
}

.hero span {
  color: #ff762b;
}

.hero p {
  color: #ccc;
  font-size: 17px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 35px 20px;
}

h2.section-title {
  color: #ff762b;
  margin-bottom: 25px;
  text-align: center;
}

.menu {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.product {
  background: #242424;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 1px solid #333;
}

.product .emoji {
  font-size: 55px;
  margin-bottom: 12px;
}

.product h3 {
  margin-bottom: 8px;
}

.product p {
  color: #aaa;
  margin-bottom: 12px;
  font-size: 14px;
}

.price {
  color: #ff762b;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 15px;
}

button {
  background: #ff762b;
  border: none;
  color: white;
  padding: 10px 16px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #e65e15;
}

.cart {
  background: #242424;
  padding: 22px;
  border-radius: 12px;
  margin-top: 45px;
}

.cart h2 {
  color: #ff762b;
  margin-bottom: 20px;
}

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid #444;
  padding: 14px 0;
}

.item button {
  padding: 6px 11px;
  margin: 0 3px;
}

.total {
  text-align: right;
  font-size: 22px;
  color: #ff762b;
  font-weight: bold;
  margin-top: 20px;
}

.order-button {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  font-size: 16px;
}

footer {
  background: #101010;
  text-align: center;
  padding: 25px;
  margin-top: 45px;
  color: #aaa;
}

@media(max-width: 500px) {
  .hero h2 {
    font-size: 29px;
  }

  .item {
    flex-wrap: wrap;
  }
}
</style>
</head>

<body>

<header>
  <h1>SANTO TACO 🌮</h1>
  <p>El verdadero sabor mexicano</p>
</header>

<section class="hero">
  <h2>¡Bienvenido a <span>SANTO TACO!</span></h2>
  <p>Buenos tacos, buenos momentos.</p>
</section>

<main class="container">

  <h2 class="section-title">NUESTRO MENÚ</h2>

  <div class="menu" id="menu"></div>

  <section class="cart">
    <h2>🛒 Tu pedido</h2>

    <div id="lista">
      Todavía no agregas productos.
    </div>

    <div class="total" id="total">
      Total: $0 MXN
    </div>

    <button class="order-button" onclick="enviar()">
      Finalizar pedido
    </button>
  </section>

</main>

<footer>
  <p>© 2026 SANTO TACO | Página de demostración</p>
</footer>

<script>

const productos = [
  {
    nombre: "Tacos al pastor",
    descripcion: "Con piña, cebolla y cilantro.",
    precio: 18,
    emoji: "🌮"
  },
  {
    nombre: "Tacos de bistec",
    descripcion: "Carne de res recién preparada.",
    precio: 22,
    emoji: "🌮"
  },
  {
    nombre: "Quesadillas",
    descripcion: "Con queso derretido.",
    precio: 35,
    emoji: "🧀"
  },
  {
    nombre: "Gringa",
    descripcion: "Tortilla de harina, queso y pastor.",
    precio: 55,
    emoji: "🌯"
  },
  {
    nombre: "Torta de pastor",
    descripcion: "Con aguacate y verduras.",
    precio: 65,
    emoji: "🥪"
  },
  {
    nombre: "Refresco",
    descripcion: "Bebida fría de 600 ml.",
    precio: 25,
    emoji: "🥤"
  }
];

let pedido = [];

function mostrar() {
  const menu = document.getElementById("menu");

  menu.innerHTML = productos.map((p, i) => `
    <div class="product">
      <div class="emoji">${p.emoji}</div>
      <h3>${p.nombre}</h3>
      <p>${p.descripcion}</p>
      <div class="price">$${p.precio} MXN</div>
      <button onclick="agregar(${i})">
        Agregar al pedido
      </button>
    </div>
  `).join("");
}

function agregar(i) {
  let producto = pedido.find(
    p => p.nombre === productos[i].nombre
  );

  if (producto) {
    producto.cantidad++;
  } else {
    pedido.push({
      ...productos[i],
      cantidad: 1
    });
  }

  actualizar();
}

function cambiarCantidad(i, cambio) {
  pedido[i].cantidad += cambio;

  if (pedido[i].cantidad <= 0) {
    pedido.splice(i, 1);
  }

  actualizar();
}

function actualizar() {
  const lista = document.getElementById("lista");

  if (pedido.length === 0) {
    lista.textContent = "Todavía no agregas productos.";
  } else {
    lista.innerHTML = pedido.map((p, i) => `
      <div class="item">
        <div>
          <strong>${p.nombre}</strong><br>
          $${p.precio} x ${p.cantidad}
        </div>

        <div>
          <button onclick="cambiarCantidad(${i}, -1)">−</button>
          <strong>${p.cantidad}</strong>
          <button onclick="cambiarCantidad(${i}, 1)">+</button>
        </div>
      </div>
    `).join("");
  }

  let total = pedido.reduce(
    (s, p) => s + p.precio * p.cantidad,
    0
  );

  document.getElementById("total").textContent =
    "Total: $" + total + " MXN";
}

function enviar() {
  if (pedido.length === 0) {
    alert("Primero agrega algo a tu pedido.");
    return;
  }

  let mensaje = "¡Hola! Este es mi pedido:\n\n";

  pedido.forEach(p => {
    mensaje += p.nombre + " x" + p.cantidad +
      " - $" + (p.precio * p.cantidad) + "\n";
  });

  let total = pedido.reduce(
    (s, p) => s + p.precio * p.cantidad,
    0
  );

  mensaje += "\nTotal: $" + total + " MXN";

  alert(mensaje + "\n\nEsta es una demostración.");
}

mostrar();
actualizar();

</script>

</body>
</html>
